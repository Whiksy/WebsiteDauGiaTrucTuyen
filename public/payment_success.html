<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả thanh toán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f8f9fa; }
        .card { width: 100%; max-width: 500px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .icon-box { font-size: 4rem; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card text-center p-5">
        <div id="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3">Đang kiểm tra kết quả giao dịch...</p>
        </div>

        <div id="success" class="d-none">
            <div class="icon-box text-success">✅</div>
            <h3 class="mb-3">Thanh toán thành công!</h3>
            <p class="text-muted">Bạn đã nạp <strong id="amount">0đ</strong> vào ví.</p>
            <p>Mã giao dịch: <span id="transId" class="text-monospace small"></span></p>
            <a href="/" class="btn btn-primary mt-3">Về trang chủ</a>
        </div>

        <div id="failed" class="d-none">
            <div class="icon-box text-danger">❌</div>
            <h3 class="mb-3">Thanh toán thất bại</h3>
            <p class="text-muted" id="error-msg">Giao dịch không thành công hoặc bị hủy.</p>
            <a href="/" class="btn btn-secondary mt-3">Về trang chủ</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const orderId = params.get('orderId');
            const resultCode = params.get('resultCode');
            
            if (!orderId) {
                showError('Không tìm thấy mã đơn hàng');
                return;
            }

            // Chỉ báo lỗi nếu resultCode tồn tại và khác 0
            if (resultCode !== null && resultCode != 0) {
                showError('Giao dịch bị từ chối hoặc hủy bỏ bởi người dùng.');
                return;
            }

            // Gọi API kiểm tra trạng thái (Double check)
            const token = localStorage.getItem('token');
            const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

            try {
                const response = await fetch(`/api/payment/status/${orderId}`, { headers });
                
                if (response.ok) {
                    const data = await response.json();

                    if (data.status === 'Paid') {
                        showSuccess(data.formattedAmount, orderId);
                    } else {
                        setTimeout(() => checkStatusLoop(orderId, headers, 1), 2000);
                    }
                } else {
                    setTimeout(() => checkStatusLoop(orderId, headers, 1), 2000);
                }
            } catch (e) {
                console.error(e);
                showError('Lỗi kết nối kiểm tra trạng thái.');
            }
        });

        async function checkStatusLoop(orderId, headers, attempt) {
            if (attempt > 10) { // Tăng thời gian chờ lên khoảng 20s
                // Nếu timeout nhưng resultCode=0 (từ URL), hiển thị thông báo mềm
                const params = new URLSearchParams(window.location.search);
                if (params.get('resultCode') == 0) {
                    showSuccess('Đang cập nhật...', orderId);
                    const p = document.createElement('p');
                    p.className = 'text-warning small mt-2';
                    p.innerText = 'Hệ thống đang xử lý chậm. Vui lòng kiểm tra ví sau ít phút.';
                    document.getElementById('success').appendChild(p);
                } else {
                    showError('Giao dịch đang được xử lý. Vui lòng kiểm tra lại ví sau.');
                }
                return;
            }
            try {
                const response = await fetch(`/api/payment/status/${orderId}`, { headers });
                if (response.ok) {
                    const data = await response.json();
                    if (data.status === 'Paid') {
                        showSuccess(data.formattedAmount, orderId);
                        return;
                    } else if (data.status === 'Failed') {
                        showError('Giao dịch thất bại.');
                        return;
                    }
                }
                // Nếu chưa Paid hoặc lỗi mạng, thử lại
                setTimeout(() => checkStatusLoop(orderId, headers, attempt + 1), 2000);
            } catch (e) {
                // Lỗi kết nối, thử lại
                setTimeout(() => checkStatusLoop(orderId, headers, attempt + 1), 2000);
            }
        }

        function showSuccess(amount, id) {
            document.getElementById('loading').classList.add('d-none');
            document.getElementById('success').classList.remove('d-none');
            document.getElementById('amount').innerText = amount;
            document.getElementById('transId').innerText = id;
        }

        function showError(msg) {
            document.getElementById('loading').classList.add('d-none');
            document.getElementById('failed').classList.remove('d-none');
            document.getElementById('error-msg').innerText = msg;
        }
    </script>
</body>
</html>
