<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Hệ thống Đấu giá Trực tuyến</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Toastify CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <!-- Custom CSS -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            animation: fadeInUp 0.8s ease-out;
        }
        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .register-header h1 {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .register-header p {
            color: #666;
        }
        .form-control {
            border-radius: 10px;
            border: 1px solid #ddd;
            padding: 12px 15px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-register {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: bold;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .role-option {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .role-option:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        .role-option.selected {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }
        .role-option input[type="radio"] {
            display: none;
        }
        .role-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 20px;
        }
        .role-user .role-icon {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: white;
        }
        .role-seller .role-icon {
            background: linear-gradient(45deg, #43e97b, #38f9d7);
            color: white;
        }
        .role-content h5 {
            margin: 0;
            font-weight: bold;
        }
        .role-content p {
            margin: 5px 0 0 0;
            color: #666;
            font-size: 14px;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
        .login-link a {
            color: #667eea;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="register-container">
            <div class="register-header">
                <h1><i class="fas fa-user-plus"></i> Đăng ký tài khoản</h1>
                <p>Tham gia cộng đồng đấu giá trực tuyến</p>
            </div>

            <form id="registerForm">
                <div class="mb-3">
                    <label for="regName" class="form-label">Họ và tên</label>
                    <input type="text" class="form-control" id="regName" placeholder="Nhập họ và tên" required>
                </div>

                <div class="mb-3">
                    <label for="regEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="regEmail" placeholder="Nhập địa chỉ email" required>
                </div>

                <div class="mb-3">
                    <label for="regPassword" class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" id="regPassword" placeholder="Tạo mật khẩu (tối thiểu 6 ký tự)" required minlength="6">
                </div>

                <div class="mb-3">
                    <label for="regAvatar" class="form-label">Ảnh đại diện (Tùy chọn)</label>
                    <input type="file" class="form-control" id="regAvatar" accept="image/*">
                    <div class="form-text text-muted">Nếu không chọn, hệ thống sẽ tạo ảnh mặc định theo tên bạn.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Chọn vai trò của bạn</label>
                    <div class="role-selection">
                        <div class="role-option role-user" onclick="selectRole('User')">
                            <input type="radio" name="role" value="User" id="roleUser" required>
                            <div class="role-icon">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="role-content">
                                <h5>Người tham gia</h5>
                                <p>Tham gia đấu giá, đặt giá cho sản phẩm yêu thích</p>
                            </div>
                        </div>

                        <div class="role-option role-seller" onclick="selectRole('Seller')">
                            <input type="radio" name="role" value="Seller" id="roleSeller" required>
                            <div class="role-icon">
                                <i class="fas fa-store"></i>
                            </div>
                            <div class="role-content">
                                <h5>Người bán</h5>
                                <p>Tạo sản phẩm, tổ chức phiên đấu giá của riêng bạn</p>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-register">Đăng ký ngay</button>
            </form>

            <div class="login-link">
                <p>Đã có tài khoản? <a href="/">Đăng nhập</a></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        let selectedRole = null;

        const showNotification = (msg, isError = false) => {
            Toastify({
                text: msg,
                duration: 3000,
                gravity: "top",
                position: "center",
                backgroundColor: isError ? "#dc3545" : "#28a745",
            }).showToast();
        };

        function selectRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-option').forEach(option => {
                option.classList.remove('selected');
            });
            document.querySelector(`.role-${role.toLowerCase()}`).classList.add('selected');
            document.getElementById(`role${role}`).checked = true;
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!selectedRole) {
                showNotification('Vui lòng chọn vai trò của bạn', true);
                return;
            }

            const avatarFile = document.getElementById('regAvatar').files[0];

            const submitRegistration = async (avatarBase64 = null) => {
                try {
                    const response = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: document.getElementById('regName').value,
                            email: document.getElementById('regEmail').value,
                            password: document.getElementById('regPassword').value,
                            role: selectedRole,
                            avatar: avatarBase64
                        })
                    });

                    console.log('Register response status:', response.status);
                    const data = await response.json();
                    console.log('Register response data:', data);

                    if (response.ok) {
                        showNotification('Đăng ký thành công! Đang chuyển hướng...');
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 2000);
                    } else {
                        showNotification(data.message || 'Đăng ký thất bại', true);
                    }
                } catch (e) {
                    console.error('Register fetch error:', e);
                    showNotification('Lỗi đăng ký, vui lòng thử lại', true);
                }
            };

            // Nếu có ảnh, chuyển sang Base64 rồi mới gửi JSON
            if (avatarFile) {
                const reader = new FileReader();
                reader.onloadend = () => submitRegistration(reader.result);
                reader.readAsDataURL(avatarFile);
            } else {
                submitRegistration(null);
            }
        });
    </script>
</body>
</html>
